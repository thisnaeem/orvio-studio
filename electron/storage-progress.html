<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'; font-src 'self'"><title>Orvio Studio</title>
<style>
@font-face{font-family:Unbounded;src:url('./startup-assets/unbounded.woff2') format('woff2');font-weight:200 900;font-display:swap}
:root{font-family:Unbounded,system-ui,sans-serif;color:#f1f0f5;background:#111113;font-synthesis:none}*{box-sizing:border-box}body{margin:0;font-weight:350;overflow:hidden}header{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 28px;border-bottom:1px solid #ffffff0c;-webkit-app-region:drag}.brand{display:flex;align-items:center;gap:10px}.brand img{width:39px;height:39px}.wordmark{font-size:22px;font-weight:600;letter-spacing:-1.3px;line-height:1}.wordmark small{display:block;font-size:7px;font-weight:400;letter-spacing:3px;color:#aaa6b8;margin-top:7px;padding-left:2px}.controls{display:flex;gap:6px;-webkit-app-region:no-drag}button{font:inherit;border:0;background:transparent;color:#96939f;width:32px;height:32px;border-radius:8px;cursor:pointer;display:grid;place-items:center}button:hover{background:#ffffff0a;color:#f1f0f5}button:focus-visible{outline:2px solid #9a7dff;outline-offset:2px}main{padding:28px 32px}.eyebrow{display:flex;align-items:center;gap:8px;font-size:8px;font-weight:450;letter-spacing:1.4px;color:#a98eff;text-transform:uppercase}.dot{width:6px;height:6px;background:#8058ff;border-radius:50%;box-shadow:0 0 0 4px #8058ff17}h1{font-size:22px;letter-spacing:-.7px;font-weight:500;margin:16px 0 12px}p{font-size:10px;line-height:1.9;color:#a4a0ae;margin:0;max-width:480px}.progress-area{margin-top:25px}.progress-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;font-size:10px}.progress-heading b{font-weight:400;color:#ab91ff;font-variant-numeric:tabular-nums}.track{height:5px;border-radius:8px;overflow:hidden;background:#ffffff0a}.track i{display:block;height:100%;width:30%;background:#8058ff;border-radius:8px;transition:width .25s}.track.waiting i{animation:move 1.7s ease-in-out infinite alternate}@keyframes move{to{transform:translateX(230%)}}#progress{margin-top:12px;color:#888391;font-size:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.8}footer{display:flex;align-items:center;gap:8px;margin:24px -32px -28px;padding:16px 32px;border-top:1px solid #ffffff0a;color:#918d9b;font-size:8px}footer svg{color:#a58fff;flex-shrink:0}@media(prefers-reduced-motion:reduce){.track.waiting i{animation:none}.track i{transition:none}}
</style></head><body>
<header><div class="brand"><img src="./startup-assets/orvio-logo.png" alt=""><div class="wordmark">orvio<small>STUDIO</small></div></div><div class="controls"><button id="minimize" title="Minimize — the move continues" aria-label="Minimize"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14"/></svg></button></div></header>
<main><div class="eyebrow"><span class="dot"></span>Setting up your space</div><h1>Your library is moving</h1><p>Bringing your models and creations to their new home.<br>Orvio will open automatically when everything is ready.</p>
<div class="progress-area"><div class="progress-heading"><span id="stage">Preparing your library</span><b id="amount">Please wait</b></div><div class="track waiting" id="track" role="progressbar" aria-label="Moving library"><i id="fill"></i></div><div id="progress" role="status">Checking your files…</div></div>
<footer><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m5 12 4 4L19 6"/></svg>Your originals stay safe until each folder is verified.</footer></main>
</body></html>
